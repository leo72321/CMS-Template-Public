name: 圖床設定｜02 Cloudflare R2
on:
  workflow_dispatch:
    inputs:
      endpoint_preset:
        description: '請選這家服務商的儲存桶所在機房'
        type: choice
        required: true
        options:
          - r2-standard
          - r2-eu
          - r2-us
          - r2-fedramp
      bucket:
        description: '已建立的 Bucket 或 Space 名稱'
        type: string
        required: true
      cdn_url:
        description: '公開 CDN 完整 HTTPS 前綴，可有 /file/桶名/ 路徑'
        type: string
        required: true
      account_id:
        description: 'Cloudflare Account ID（32 位，非 S3 金鑰）'
        required: true
        type: string
permissions:
  contents: write
jobs:
  configure:
    uses: ./.github/workflows/_圖床共用套用.yml
    with:
      endpoint_preset: ${{ inputs.endpoint_preset }}
      bucket: ${{ inputs.bucket }}
      cdn_url: ${{ inputs.cdn_url }}
      account_id: ${{ inputs.account_id }}
