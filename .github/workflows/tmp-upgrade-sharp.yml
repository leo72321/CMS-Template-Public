name: Temporary lockfile regeneration for sharp security update
on:
  push:
    branches:
      - fix/merged-code-review-v0.2.1-20261025
    paths:
      - .github/workflows/tmp-upgrade-sharp.yml
permissions:
  contents: write
jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Regenerate reproducible lockfile
        run: npm install sharp@0.35.5 --save-exact --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile to this review branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "No dependency changes" >&2; exit 1; }
          git commit -m "fix(deps): upgrade sharp to patched 0.35.5"
          git push origin HEAD:fix/merged-code-review-v0.2.1-20261025
