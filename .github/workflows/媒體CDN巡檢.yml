name: 媒體 CDN 分批巡檢
on:
  schedule:
    # 每週日台灣凌晨 01:12；此工作不修改網站或雲端儲存。
    - cron: '12 17 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: '巡檢模式；分批預設每週 1000 個，全部用於人工完整校驗'
        required: true
        type: choice
        default: batch
        options:
          - batch
          - full
permissions:
  contents: read
concurrency:
  group: media-cdn-audit
  cancel-in-progress: false
jobs:
  audit:
    name: CDN 巡檢（無上傳金鑰）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 無雲端圖片時節省 Runner 與安裝成本
        id: gate
        run: |
          if node -e "const x=require('./content/media/manifest.json');process.exit((x.uploads||[]).length > 0 ? 0 : 1)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "媒體索引沒有遠端圖片，跳過本次巡檢。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安裝專案既有依賴
        if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: 每週輪替檢查，或手動檢查全部
        if: steps.gate.outputs.run == 'true'
        env:
          FULL_SCAN: ${{ github.event.inputs.mode }}
        run: |
          if [ "$FULL_SCAN" = "full" ]; then
            npm run media:verify -- --full
          else
            npm run media:verify -- --batch-size 1000
          fi
