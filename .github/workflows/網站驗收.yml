name: 網站自動驗收
on:
  push:
  pull_request:
  workflow_dispatch:
  # GITHUB_TOKEN 推送不會觸發 push CI；監聽內容寫入工作流程完成事件。
  workflow_run:
    workflows:
      - 媒體上傳｜圖片與 PDF／ZIP 附件
      - 圖床設定｜S3 一站式驗證與套用
      - 網站初始化精靈（基本資料）
      - 301 轉址容量維護
    types: [completed]
permissions:
  contents: read
concurrency:
  group: 網站驗收-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: 內容、SEO 與效能檢查
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 取得網站原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 設定 Node.js 執行環境
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安裝固定版本套件
        run: npm ci
      - name: 掃描相依套件高風險弱點
        run: npm audit --audit-level=high
      - name: 確認中文結構報表已提交
        run: npm run docs:check
      - name: 型別、測試、建置與網站驗收
        run: npm run verify
      - name: 保存可下載的中文驗收報表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 網站驗收報表
          path: .reports/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: 保存靜態網站產物
        uses: actions/upload-artifact@v4
        with:
          name: 靜態網站
          path: dist/
