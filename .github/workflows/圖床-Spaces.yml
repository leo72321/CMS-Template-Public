name: 圖床設定｜05 DigitalOcean Spaces
on:
  workflow_dispatch:
    inputs:
      endpoint_preset:
        description: '請選這家服務商的儲存桶所在機房'
        type: choice
        required: true
        options:
          - do-sgp1
          - do-nyc3
          - do-ams3
          - do-fra1
      bucket:
        description: '已建立的 Bucket 或 Space 名稱'
        type: string
        required: true
      cdn_url:
        description: '公開 CDN 完整 HTTPS 前綴，可有 /file/桶名/ 路徑'
        type: string
        required: true
permissions:
  contents: write
jobs:
  configure:
    uses: ./.github/workflows/_圖床共用套用.yml
    with:
      endpoint_preset: ${{ inputs.endpoint_preset }}
      bucket: ${{ inputs.bucket }}
      cdn_url: ${{ inputs.cdn_url }}
