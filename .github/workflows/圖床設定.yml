name: 圖床設定｜09 其他／自訂 S3
on:
  workflow_dispatch:
    inputs:
      custom_provider:
        description: '供應商；清單以外機房或其他 S3 相容服務在這裡填'
        type: choice
        required: true
        default: other-s3
        options:
          - b2
          - r2
          - aws-s3
          - wasabi
          - digitalocean
          - hetzner
          - scaleway
          - akamai
          - other-s3
      region:
        description: '手動 Region，例如 us-west-005、auto'
        type: string
        required: true
      endpoint:
        description: '供應商後台的完整 HTTPS S3 Endpoint'
        type: string
        required: true
      bucket:
        description: 'Bucket／Space 名稱'
        type: string
        required: true
      cdn_url:
        description: '公開 CDN HTTPS 完整前綴（可包含 /file/桶名/）'
        type: string
        required: true
permissions:
  contents: write
jobs:
  configure:
    uses: ./.github/workflows/_圖床共用套用.yml
    with:
      endpoint_preset: custom
      custom_provider: ${{ inputs.custom_provider }}
      region: ${{ inputs.region }}
      endpoint: ${{ inputs.endpoint }}
      bucket: ${{ inputs.bucket }}
      cdn_url: ${{ inputs.cdn_url }}
