name: 網站初始化精靈
on:
  workflow_dispatch:
    inputs:
      domain:
        description: '正式網域，例如 example.com（不要加 https://）'
        required: true
        type: string
      title:
        description: '網站名稱'
        required: true
        type: string
      description:
        description: '網站簡介'
        required: true
        type: string
      author:
        description: '作者或品牌名稱'
        required: true
        type: string
      storage:
        description: '圖片儲存服務（統一使用 S3 相容協議）'
        required: true
        default: b2
        type: choice
        options:
          - b2
          - r2
          - aws-s3
          - wasabi
          - digitalocean
          - hetzner
          - scaleway
          - akamai
          - other-s3
      region:
        description: 'S3 Region，如 B2 us-west-004／Spaces sgp1；R2 留空自動 auto'
        required: false
        type: string
      endpoint:
        description: '可選 S3 API Endpoint；Akamai／Other S3 必須填'
        required: false
        type: string
      account_id:
        description: '僅 Cloudflare R2 需填 32 字元 Account ID（若已填 Endpoint 可留空）'
        required: false
        type: string
      bucket:
        description: 'Bucket 名稱，需先自行建立'
        required: true
        type: string
      cdn_url:
        description: 'CDN 完整公開 HTTPS URL，可含 /file/桶名/，不得填 S3 Endpoint'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: cms-configuration-main
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 驗證欄位並更新網站設定
        env:
          INIT_DOMAIN: ${{ inputs.domain }}
          INIT_TITLE: ${{ inputs.title }}
          INIT_DESCRIPTION: ${{ inputs.description }}
          INIT_AUTHOR: ${{ inputs.author }}
          INIT_STORAGE: ${{ inputs.storage }}
          INIT_ENDPOINT: ${{ inputs.endpoint }}
          INIT_REGION: ${{ inputs.region }}
          INIT_BUCKET: ${{ inputs.bucket }}
          INIT_CDN_URL: ${{ inputs.cdn_url }}
          INIT_ACCOUNT_ID: ${{ inputs.account_id }}
        run: node --import tsx scripts/setup-action.ts
      - name: 驗證網站
        run: npm run verify
      - name: 儲存網站設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.config.json docs/SITE_STRUCTURE.md docs/CONTENT_INDEX.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): initialize site configuration"
            git push
          fi
