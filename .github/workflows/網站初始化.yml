name: 網站初始化精靈（基本資料）
on:
  workflow_dispatch:
    inputs:
      domain:
        description: '正式網域，例如 example.com（不含 https）'
        type: string
        required: true
      title:
        description: '網站名稱'
        type: string
        required: true
      description:
        description: '網站簡介'
        type: string
        required: true
      author:
        description: '作者／品牌名稱'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: cms-configuration-main
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 建立網站基本資料（圖床在下一步依供應商設定）
        env:
          INIT_DOMAIN: ${{ inputs.domain }}
          INIT_TITLE: ${{ inputs.title }}
          INIT_DESCRIPTION: ${{ inputs.description }}
          INIT_AUTHOR: ${{ inputs.author }}
        run: node --import tsx scripts/setup-action.ts
      - name: 驗證網站
        run: npm run verify
      - name: 提交網站基本設定
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.config.json docs/SITE_STRUCTURE.md docs/CONTENT_INDEX.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): initialize site identity"
            git push origin HEAD:main
          fi
